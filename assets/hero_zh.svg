<path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1199" height="329" rx="14"/><text x="48" y="64" font-size="13" font-weight="700" text-anchor="start" class="t1" letter-spacing="2">NANO-VLLM · QWEN3.5 / QWEN3.6</text><text x="48" y="110" font-size="36" font-weight="700" text-anchor="start">面向 Qwen 混合架构的可读推理引擎</text><text x="48" y="146" font-size="16" font-weight="400" text-anchor="start" class="ink2">约 4200 行 Python · GatedDeltaNet + 全注意力 · 分页 KV 缓存 · CUDA Graph · 张量并行 · FP8 加载 · MTP 原型</text><rect x="48" y="178" width="264" height="112" rx="10" class="card"/><rect x="48" y="178" width="4" height="112" rx="2" class="f1"/><text x="70" y="228" font-size="34" font-weight="700">41<tspan font-size="16" font-weight="600" class="ink2" dx="6">tok/s</tspan></text><text x="70" y="256" font-size="13" font-weight="400" text-anchor="start" class="ink2">Qwen3.5-9B BF16 解码</text><text x="70" y="275" font-size="13" font-weight="400" text-anchor="start" class="muted">单张 RTX 3090，batch 1</text><rect x="328" y="178" width="264" height="112" rx="10" class="card"/><rect x="328" y="178" width="4" height="112" rx="2" class="f3"/><text x="350" y="228" font-size="34" font-weight="700">83%<tspan font-size="16" font-weight="600" class="ink2" dx="6">带宽</tspan></text><text x="350" y="256" font-size="13" font-weight="400" text-anchor="start" class="ink2">解码 GEMM 达到的显存带宽</text><text x="350" y="275" font-size="13" font-weight="400" text-anchor="start" class="muted">约 780 GB/s / 峰值 936 GB/s</text><rect x="608" y="178" width="264" height="112" rx="10" class="card"/><rect x="608" y="178" width="4" height="112" rx="2" class="f1"/><text x="630" y="228" font-size="34" font-weight="700">138<tspan font-size="16" font-weight="600" class="ink2" dx="6">tok/s</tspan></text><text x="630" y="256" font-size="13" font-weight="400" text-anchor="start" class="ink2">4 条请求合计解码吞吐</text><text x="630" y="275" font-size="13" font-weight="400" text-anchor="start" class="muted">单张 RTX 3090</text><rect x="888" y="178" width="264" height="112" rx="10" class="card"/><rect x="888" y="178" width="4" height="112" rx="2" class="f7"/><text x="910" y="228" font-size="34" font-weight="700">41<tspan font-size="16" font-weight="600" class="ink2" dx="6">tok/s</tspan></text><text x="910" y="256" font-size="13" font-weight="400" text-anchor="start" class="ink2">Qwen3.6-27B-FP8 解码</text><text x="910" y="275" font-size="13" font-weight="400" text-anchor="start" class="muted">4× RTX 4090，TP=4</text></svg>
