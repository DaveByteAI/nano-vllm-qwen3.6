<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="架构"><title>架构</title><style>
svg{--bg:#fcfcfb;--card:#f3f2ef;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--line:#dcdbd5;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s7:#4a3aa7;--s1soft:#dbe8f8;--s2soft:#fbe3d8;--s3soft:#d5f0e5}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--card:#252523;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#3b3b38;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--s1soft:#1d2d42;--s2soft:#3d2419;--s3soft:#16352a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)} .card{fill:var(--card)} .ink2{fill:var(--ink2)} .muted{fill:var(--muted)}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f7{fill:var(--s7)}
.t1{fill:var(--s1)} .t2{fill:var(--s2)}
.soft1{fill:var(--s1soft)} .soft2{fill:var(--s2soft)} .soft3{fill:var(--s3soft)}
.ln{stroke:var(--line);fill:none} .lnk{stroke:var(--ink2);fill:none} .dash{stroke-dasharray:5 4}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.est{fill:url(#hatch);stroke:var(--s1);stroke-width:1.5}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" style="fill:var(--s1soft)"/><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--s1);stroke-width:2"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1199" height="599" rx="14"/><text x="40" y="50" font-size="22" font-weight="700" text-anchor="start">架构</text><text x="40" y="76" font-size="14" font-weight="400" text-anchor="start" class="ink2">左边是一次请求经过的路径，右边是它驱动的 Qwen3.5 混合解码器。</text><rect x="40" y="104" width="362" height="74" rx="10" class="soft1"/><text x="58" y="132" font-size="16" font-weight="700" text-anchor="start" class="mono">LLM.generate()</text><text x="58" y="153" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">Python API：prompts + SamplingParams</text><line x1="221.0" y1="180" x2="221.0" y2="198" class="lnk" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="202" width="362" height="74" rx="10" class="soft1"/><text x="58" y="230" font-size="16" font-weight="700" text-anchor="start" class="mono">LLMEngine</text><text x="58" y="251" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">分词 · step 循环 · 张量并行 worker 进程</text><text x="58" y="268" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">（每个 rank 一个进程，共享内存 RPC）</text><line x1="221.0" y1="278" x2="221.0" y2="296" class="lnk" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="300" width="362" height="74" rx="10" class="soft1"/><text x="58" y="328" font-size="16" font-weight="700" text-anchor="start" class="mono">Scheduler</text><text x="58" y="349" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">prefill / decode 分批调度</text><text x="58" y="366" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">BlockManager：分页 KV（256 token/块）+ GDN 状态槽</text><line x1="221.0" y1="376" x2="221.0" y2="394" class="lnk" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="398" width="362" height="74" rx="10" class="soft1"/><text x="58" y="426" font-size="16" font-weight="700" text-anchor="start" class="mono">ModelRunner</text><text x="58" y="447" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">准备输入 · decode 用 CUDA Graph 重放</text><text x="58" y="464" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">采样 · 按 rank 加载 FP8 并反量化为 BF16</text><line x1="221.0" y1="474" x2="221.0" y2="492" class="lnk" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="496" width="362" height="74" rx="10" class="soft3"/><text x="58" y="524" font-size="16" font-weight="700" text-anchor="start" class="mono">Qwen3.5 模型</text><text x="58" y="545" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">embed → 32 层解码器 → lm_head</text><text x="58" y="562" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">可选视觉编码器 · MTP 头</text><line x1="404" y1="533" x2="426" y2="533" class="lnk" stroke-width="1.5" marker-end="url(#arr)"/><rect x="430" y="104" width="730" height="466" rx="12" class="card"/><text x="454" y="138" font-size="17" font-weight="700" text-anchor="start">Qwen3.5-9B 解码器 · 32 层，线性注意力 : 全注意力 = 3 : 1</text><rect x="454.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="475.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="497.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="518.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="540.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="561.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="583.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="604.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="626.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="647.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="669.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="690.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="712.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="733.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="755.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="776.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="798.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="819.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="841.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="862.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="884.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="905.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="927.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="948.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="970.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="991.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="1013.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="1034.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="1056.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="1077.5" y="156" width="19" height="34" rx="3" class="f1"/><rect x="1099.0" y="156" width="19" height="34" rx="3" class="f1"/><rect x="1120.5" y="156" width="19" height="34" rx="3" class="f2"/><rect x="454" y="202" width="12" height="12" rx="2" class="f1"/><text x="472" y="212" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">GatedDeltaNet（线性注意力）× 24</text><rect x="814" y="202" width="12" height="12" rx="2" class="f2"/><text x="832" y="212" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">全注意力 × 8（第 i 层，(i+1) % 4 == 0）</text><rect x="454" y="232" width="333" height="248" rx="10" class="bg"/><rect x="454" y="232" width="333" height="5" rx="2" class="f1"/><text x="470" y="264" font-size="15" font-weight="700" text-anchor="start">GatedDeltaNet 层</text><text x="470" y="296" font-size="12" font-weight="700" text-anchor="start" class="muted" letter-spacing="1">数据流</text><text x="470" y="316" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">in_proj qkv / z / b / a</text><text x="470" y="336" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">→ 因果深度卷积 conv1d（k = 4）</text><text x="470" y="356" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">→ 门控 delta 规则  S ← g·S + k·β(v − Sᵀk)</text><text x="470" y="376" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">→ 门控 RMSNorm → out_proj</text><text x="470" y="402" font-size="12" font-weight="700" text-anchor="start" class="muted" letter-spacing="1">每条序列的状态</text><text x="470" y="422" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">conv：3 列 · 递推状态 S：32×128×128 fp32</text><text x="470" y="442" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">每层约 2 MB，与上下文长度无关</text><text x="470" y="462" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">prefill：分块（64）· decode：逐 token 递推</text><rect x="803" y="232" width="333" height="248" rx="10" class="bg"/><rect x="803" y="232" width="333" height="5" rx="2" class="f2"/><text x="819" y="264" font-size="15" font-weight="700" text-anchor="start">全注意力层</text><text x="819" y="296" font-size="12" font-weight="700" text-anchor="start" class="muted" letter-spacing="1">数据流</text><text x="819" y="316" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">q（+ 输出门）/ k / v 投影</text><text x="819" y="336" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">→ QK RMSNorm → 部分交错 MRoPE</text><text x="819" y="356" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">→ FlashAttention（变长 / 分页 KV）</text><text x="819" y="376" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">→ sigmoid 门 → o_proj</text><text x="819" y="402" font-size="12" font-weight="700" text-anchor="start" class="muted" letter-spacing="1">每条序列的状态</text><text x="819" y="422" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">分页 KV 缓存：4 个 KV 头 × 256 维，bf16</text><text x="819" y="442" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">8 层合计每 token 约 32 KB</text><text x="819" y="462" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">随上下文长度增长</text><rect x="454" y="496" width="682" height="62" rx="10" class="bg"/><text x="470" y="522" font-size="13" font-weight="600" text-anchor="start">每一层：RMSNorm + SwiGLU MLP（4096 → 12288 → 4096）</text><text x="470" y="542" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">Embedding 与 lm_head 不共享：各 248,320 × 4096（BF16 各 2.0 GB）</text></svg>
