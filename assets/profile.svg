<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1199" height="469" rx="14"/><text x="40" y="50" font-size="22" font-weight="700" text-anchor="start">Profile · Qwen3.5-9B BF16 on one RTX 3090</text><text x="40" y="76" font-size="14" font-weight="400" text-anchor="start" class="ink2">Measured with torch.profiler and wall-clock timing; batch 1, greedy.</text><text x="40" y="112" font-size="15" font-weight="700" text-anchor="start">Decode: one token (GPU kernel time)</text><rect x="40.0" y="150" width="393.81481481481484" height="44" rx="4" class="f1"/><rect x="435.81481481481484" y="150" width="101.07407407407408" height="44" rx="4" class="f2"/><text x="54.0" y="178" font-size="14" font-weight="700" text-anchor="start" style="fill:#fff">GEMM / GEMV  20.5 ms · 79%</text><text x="485.85185185185185" y="178" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">21%</text><line x1="367.4074074074074" y1="120" x2="367.4074074074074" y2="234" class="lnk dash" stroke-width="1.3"/><line x1="506.0740740740741" y1="120" x2="506.0740740740741" y2="234" class="lnk dash" stroke-width="1.3"/><text x="361.4074074074074" y="134" font-size="12" font-weight="400" text-anchor="end" class="muted">bandwidth floor 17.0 ms</text><text x="500.0740740740741" y="228" font-size="12" font-weight="600" text-anchor="end" class="ink2">CUDA Graph step 24.2 ms</text><line x1="40.0" y1="256" x2="560.0" y2="256" class="ln" stroke-width="1"/><line x1="40.0" y1="256" x2="40.0" y2="261" class="ln"/><text x="40.0" y="276" font-size="12" font-weight="400" text-anchor="middle" class="muted">0</text><line x1="136.2962962962963" y1="256" x2="136.2962962962963" y2="261" class="ln"/><text x="136.2962962962963" y="276" font-size="12" font-weight="400" text-anchor="middle" class="muted">5</text><line x1="232.59259259259258" y1="256" x2="232.59259259259258" y2="261" class="ln"/><text x="232.59259259259258" y="276" font-size="12" font-weight="400" text-anchor="middle" class="muted">10</text><line x1="328.8888888888889" y1="256" x2="328.8888888888889" y2="261" class="ln"/><text x="328.8888888888889" y="276" font-size="12" font-weight="400" text-anchor="middle" class="muted">15</text><line x1="425.18518518518516" y1="256" x2="425.18518518518516" y2="261" class="ln"/><text x="425.18518518518516" y="276" font-size="12" font-weight="400" text-anchor="middle" class="muted">20</text><line x1="521.4814814814815" y1="256" x2="521.4814814814815" y2="261" class="ln"/><text x="521.4814814814815" y="276" font-size="12" font-weight="400" text-anchor="middle" class="muted">25</text><text x="564.0" y="276" font-size="12" font-weight="400" text-anchor="start" class="muted">ms</text><rect x="40" y="297" width="12" height="12" rx="2" class="f1"/><text x="58" y="308" font-size="13" font-weight="400" text-anchor="start" class="ink2">Weight GEMM/GEMV: 15.87 GB read per token ≈ 780 GB/s (83% of 936 GB/s)</text><rect x="40" y="321" width="12" height="12" rx="2" class="f2"/><text x="58" y="332" font-size="13" font-weight="400" text-anchor="start" class="ink2">~2,200 small kernels: GDN state gather/scatter, elementwise, norms</text><text x="40" y="366" font-size="12.5" font-weight="400" text-anchor="start" class="muted">2,263 kernels per step. The orange part is what fusion can remove;</text><text x="40" y="386" font-size="12.5" font-weight="400" text-anchor="start" class="muted">the blue part only shrinks with fewer weight bytes (quantization).</text><text x="660" y="112" font-size="15" font-weight="700" text-anchor="start">Prefill latency vs prompt length</text><text x="740" y="162" font-size="13" font-weight="400" text-anchor="end" class="ink2">16 tok</text><rect x="752" y="144" width="100.21052631578947" height="28" rx="4" class="f2"/><text x="860.2105263157895" y="163" font-size="13" font-weight="600" text-anchor="start">238 ms</text><text x="740" y="212" font-size="13" font-weight="400" text-anchor="end" class="ink2">128 tok</text><rect x="752" y="194" width="106.98947368421052" height="28" rx="4" class="f1"/><text x="866.9894736842106" y="213" font-size="13" font-weight="600" text-anchor="start">254 ms</text><text x="740" y="262" font-size="13" font-weight="400" text-anchor="end" class="ink2">512 tok</text><rect x="752" y="244" width="159.32631578947365" height="28" rx="4" class="f1"/><text x="919.3263157894737" y="263" font-size="13" font-weight="600" text-anchor="start">378 ms</text><text x="740" y="312" font-size="13" font-weight="400" text-anchor="end" class="ink2">2048 tok</text><rect x="752" y="294" width="378.35789473684207" height="28" rx="4" class="f1"/><text x="1138.3578947368421" y="313" font-size="13" font-weight="600" text-anchor="start">899 ms</text><line x1="760.421052631579" y1="134" x2="760.421052631579" y2="350" class="lnk dash" stroke-width="1.3"/><text x="764.421052631579" y="368" font-size="12" font-weight="400" text-anchor="start" class="muted">one pass over the weights ≈ 20 ms</text><text x="660" y="404" font-size="12.5" font-weight="400" text-anchor="start" class="muted">Short prompts are CPU-bound: a 63-step Python loop per 64-token chunk</text><text x="660" y="424" font-size="12.5" font-weight="400" text-anchor="start" class="muted">in every GDN layer, plus .item() syncs (14.5k kernel launches @ 512 tok).</text></svg>
