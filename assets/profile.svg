@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--card:#252523;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#3b3b38;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--s1soft:#1d2d42;--s2soft:#3d2419;--s3soft:#16352a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)} .card{fill:var(--card)} .ink2{fill:var(--ink2)} .muted{fill:var(--muted)}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f7{fill:var(--s7)}
.t1{fill:var(--s1)} .t2{fill:var(--s2)}
.soft1{fill:var(--s1soft)} .soft2{fill:var(--s2soft)} .soft3{fill:var(--s3soft)}
.ln{stroke:var(--line);fill:none} .lnk{stroke:var(--ink2);fill:none} .dash{stroke-dasharray:5 4}
