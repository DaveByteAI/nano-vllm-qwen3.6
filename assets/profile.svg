<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Profile · Qwen3.5-9B BF16 on one RTX 3090"><title>Profile · Qwen3.5-9B BF16 on one RTX 3090</title><style>
svg{--bg:#fcfcfb;--card:#f3f2ef;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--line:#dcdbd5;
