<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Optimization roadmap · single RTX 3090, Qwen3.5-9B decode"><title>Optimization roadmap · single RTX 3090, Qwen3.5-9B decode</title><style>
svg{--bg:#fcfcfb;--card:#f3f2ef;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--line:#dcdbd5;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s7:#4a3aa7;--s1soft:#dbe8f8;--s2soft:#fbe3d8;--s3soft:#d5f0e5}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--card:#252523;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#3b3b38;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--s1soft:#1d2d42;--s2soft:#3d2419;--s3soft:#16352a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)} .card{fill:var(--card)} .ink2{fill:var(--ink2)} .muted{fill:var(--muted)}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f7{fill:var(--s7)}
.t1{fill:var(--s1)} .t2{fill:var(--s2)}
.soft1{fill:var(--s1soft)} .soft2{fill:var(--s2soft)} .soft3{fill:var(--s3soft)}
.ln{stroke:var(--line);fill:none} .lnk{stroke:var(--ink2);fill:none} .dash{stroke-dasharray:5 4}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.est{fill:url(#hatch);stroke:var(--s1);stroke-width:1.5}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" style="fill:var(--s1soft)"/><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--s1);stroke-width:2"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1199" height="479" rx="14"/><text x="40" y="50" font-size="22" font-weight="700" text-anchor="start">Optimization roadmap · single RTX 3090, Qwen3.5-9B decode</text><text x="40" y="76" font-size="14" font-weight="400" text-anchor="start" class="ink2">Not implemented yet. Hatched bars are estimates from the profile above, not measurements.</text><line x1="706.6153846153846" y1="104" x2="706.6153846153846" y2="408" class="lnk dash" stroke-width="1.3"/><text x="710.6153846153846" y="420" font-size="12" font-weight="400" text-anchor="start" class="muted">BF16 bandwidth floor 58 tok/s</text><text x="40" y="130" font-size="15" font-weight="700" text-anchor="start">Today · BF16</text><text x="40" y="150" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">measured, CUDA Graph, batch 1</text><rect x="430" y="118" width="197.44615384615383" height="30" rx="4" class="f1"/><text x="637.4461538461538" y="138" font-size="14" font-weight="700" text-anchor="start" class="halo">41.4 tok/s</text><text x="40" y="192" font-size="15" font-weight="700" text-anchor="start">1 · Triton chunk kernel for prefill</text><text x="40" y="212" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">decode unchanged; TTFT 238 ms → ~30–50 ms (est.)</text><rect x="430" y="180" width="197.44615384615383" height="30" rx="4" class="est"/><text x="637.4461538461538" y="200" font-size="14" font-weight="700" text-anchor="start" class="halo">~41.4 tok/s</text><text x="40" y="254" font-size="15" font-weight="700" text-anchor="start">2 · Fuse GDN decode + merge projections</text><text x="40" y="274" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">remove most of the 5 ms of small kernels</text><rect x="430" y="242" width="238.46153846153848" height="30" rx="4" class="est"/><text x="678.4615384615385" y="262" font-size="14" font-weight="700" text-anchor="start" class="halo">~48–50 tok/s</text><text x="40" y="316" font-size="15" font-weight="700" text-anchor="start">3 · INT8 weight-only (W8A16)</text><text x="40" y="336" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">~8 GB read per token</text><rect x="430" y="304" width="381.53846153846155" height="30" rx="4" class="est"/><text x="821.5384615384615" y="324" font-size="14" font-weight="700" text-anchor="start" class="halo">~80 tok/s</text><text x="40" y="378" font-size="15" font-weight="700" text-anchor="start">4 · INT4 weight-only (AWQ/GPTQ + Marlin)</text><text x="40" y="398" font-size="12.5" font-weight="400" text-anchor="start" class="ink2">~4.5 GB per token; also fits 27B on one 24 GB card</text><rect x="430" y="366" width="596.1538461538462" height="30" rx="4" class="est"/><text x="1036.1538461538462" y="386" font-size="14" font-weight="700" text-anchor="start" class="halo">~110–125 tok/s</text><rect x="40" y="443" width="12" height="12" rx="2" class="f1"/><text x="58" y="454" font-size="13" font-weight="400" text-anchor="start" class="ink2">measured</text><rect x="200" y="443" width="12" height="12" rx="2" class="est"/><text x="218" y="454" font-size="13" font-weight="400" text-anchor="start" class="ink2">estimate</text></svg>
